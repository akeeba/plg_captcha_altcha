PLG_CAPTCHA_ALTCHA="CAPTCHA - ALTCHA"
PLG_CAPTCHA_ALTCHA_XML_DESCRIPTION="Implementiert die quelloffene, selbst gehostete Proof-of-Work-Alternative <a href=\"https://altcha.org\" target=\"_blank\">ALTCHA</a> zu einem CAPTCHA. Ihre Nutzer müssen keine Rätsel lösen oder verzerrte Buchstaben lesen. Sie klicken einfach ein Kontrollkästchen an. Vollständig DSGVO-konform und selbst gehostet."

; Plugin-Optionen - Basis
PLG_CAPTCHA_ALTCHA_FIELD_DEPRECATION_MAINTAINED="Dieses Plugin wird nur bis Mitte Oktober 2027 gepflegt. Bitte aktualisieren Sie auf Joomla 6.2 oder neuer, das ALTCHA-Unterstützung enthält. Bitte verwenden Sie nach dem Upgrade das native Plugin „CAPTCHA - Proof of Work“ und deinstallieren Sie dieses Plugin."
PLG_CAPTCHA_ALTCHA_FIELD_DEPRECATION_UNSUPPORTED="Dieses Plugin wird unter Joomla 6.1 oder neuer NICHT unterstützt. Bitte verwenden Sie das native Plugin „CAPTCHA - Proof of Work“, das dieselbe ALTCHA-Bibliothek verwendet, und deinstallieren Sie dieses Plugin."
PLG_CAPTCHA_ALTCHA_FIELD_DEPRECATION_MAINTAINED_OBSOLETE="Dieses Plugin wird nicht mehr gepflegt. Bitte aktualisieren Sie auf Joomla 6.2 oder neuer, das ALTCHA-Unterstützung enthält. Bitte verwenden Sie nach dem Upgrade das native Plugin „CAPTCHA - Proof of Work“ und deinstallieren Sie dieses Plugin."
PLG_CAPTCHA_ALTCHA_FIELD_DEPRECATION_UNSUPPORTED_OBSOLETE="Dieses Plugin wird unter Joomla 6.1 oder neuer NICHT unterstützt und wird nicht mehr gepflegt. Bitte verwenden Sie das native Plugin „CAPTCHA - Proof of Work“, das dieselbe ALTCHA-Bibliothek verwendet, und deinstallieren Sie dieses Plugin."

PLG_CAPTCHA_ALTCHA_FIELD_AUTO_LABEL="Automatischer Modus"
PLG_CAPTCHA_ALTCHA_FIELD_AUTO_DESC="Startet die Verifizierung automatisch ohne Benutzerinteraktion. Die Verwendung eines anderen Wertes als Aus wird für die WCAG 2.2-Konformität empfohlen, wie in <a href=\"https://altcha.org/docs/wcag/\" target=\"_blank\">ALTCHAs Dokumentation</a> erläutert."
PLG_CAPTCHA_ALTCHA_FIELD_AUTO_OPT_OFF="Aus"
PLG_CAPTCHA_ALTCHA_FIELD_AUTO_OPT_ONFOCUS="Wenn das CAPTCHA-Feld den Fokus erhält (onfocus)"
PLG_CAPTCHA_ALTCHA_FIELD_AUTO_OPT_ONLOAD="Beim Laden der Seite (onload)"
PLG_CAPTCHA_ALTCHA_FIELD_AUTO_OPT_ONSUBMIT="Beim Absenden des Formulars (onsubmit)"

PLG_CAPTCHA_ALTCHA_FIELD_HASH_LABEL="Hash-Algorithmus"
PLG_CAPTCHA_ALTCHA_FIELD_HASH_DESC="Der zu verwendende Hash-Algorithmus für den Proof-of-Work. SHA-512 benötigt deutlich mehr Rechenleistung als SHA-1 und macht das CAPTCHA schwerer zu umgehen."
PLG_CAPTCHA_ALTCHA_FIELD_HASH_OPT_SHA1="SHA-1"
PLG_CAPTCHA_ALTCHA_FIELD_HASH_OPT_SHA256="SHA-256"
PLG_CAPTCHA_ALTCHA_FIELD_HASH_OPT_SHA512="SHA-512"

PLG_CAPTCHA_ALTCHA_FIELD_MAXNUMBER_LABEL="Maximalzahl"
PLG_CAPTCHA_ALTCHA_FIELD_MAXNUMBER_DESC="Der Proof-of-Work iteriert Zahlen zwischen 1 und dieser Zahl. Je höher diese Zahl, desto stärker das CAPTCHA, aber desto länger dauert die Lösung auf weniger leistungsfähigen Geräten (z. B. ältere Smartphones). Standard: 50000. Empfohlen für ein starkes CAPTCHA: 1000000. Wertebereich: 1000 bis 1000000."

PLG_CAPTCHA_ALTCHA_FIELD_SALTLENGTH_LABEL="Salt-Länge"
PLG_CAPTCHA_ALTCHA_FIELD_SALTLENGTH_DESC="Die Länge der Zufallsdaten, die für die CAPTCHA-Herausforderung verwendet werden. Je länger, desto langsamer wird das Lösen des CAPTCHAs. Standard: 16. Bereich: 12 bis 64."

PLG_CAPTCHA_ALTCHA_FIELD_EXPIRES_LABEL="Ablaufzeit"
PLG_CAPTCHA_ALTCHA_FIELD_EXPIRES_DESC="Wie lange das CAPTCHA gültig ist. Je kürzer, desto besser für die Formularsicherheit, aber zu kurze Werte können auf langsameren Verbindungen oder Geräten zu CAPTCHA-Fehlern führen. Werte unter 30 Sekunden sind meist unpraktisch. Ein bereits gelöstes ALTCHA auf der Seite wird sich kurz vor Ablauf automatisch aktualisieren und neu lösen. Standard: 2 Minuten."
PLG_CAPTCHA_ALTCHA_FIELD_EXPIRES_OPT_PT10S="10 Sekunden"
PLG_CAPTCHA_ALTCHA_FIELD_EXPIRES_OPT_PT30S="30 Sekunden"
PLG_CAPTCHA_ALTCHA_FIELD_EXPIRES_OPT_PT1M="1 Minute"
PLG_CAPTCHA_ALTCHA_FIELD_EXPIRES_OPT_PT2M="2 Minuten"
PLG_CAPTCHA_ALTCHA_FIELD_EXPIRES_OPT_PT10M="10 Minuten"
PLG_CAPTCHA_ALTCHA_FIELD_EXPIRES_OPT_PT30M="30 Minuten"
PLG_CAPTCHA_ALTCHA_FIELD_EXPIRES_OPT_PT1H="1 Stunde"
PLG_CAPTCHA_ALTCHA_FIELD_EXPIRES_OPT_PT2H="2 Stunden"
PLG_CAPTCHA_ALTCHA_FIELD_EXPIRES_OPT_PT6H="6 Stunden"
PLG_CAPTCHA_ALTCHA_FIELD_EXPIRES_OPT_PT12H="12 Stunden"
PLG_CAPTCHA_ALTCHA_FIELD_EXPIRES_OPT_P1D="1 Tag"

PLG_CAPTCHA_ALTCHA_FIELD_DELAY_LABEL="Verzögerung (ms)"
PLG_CAPTCHA_ALTCHA_FIELD_DELAY_DESC="Fügt eine künstliche Verzögerung vor dem Start des Proof-of-Work-Algorithmus hinzu. Standard: 0. Bereich: 0 bis 10000 (in Millisekunden, d. h. 0 bis 10 Sekunden)."

PLG_CAPTCHA_ALTCHA_FIELD_HIDEFOOTER_LABEL="Footer ausblenden"
PLG_CAPTCHA_ALTCHA_FIELD_HIDEFOOTER_DESC="Den Footer (ALTCHA-Link) ausblenden"

PLG_CAPTCHA_ALTCHA_FIELD_HIDELOGO_LABEL="Logo ausblenden"
PLG_CAPTCHA_ALTCHA_FIELD_HIDELOGO_DESC="Das ALTCHA-Logo ausblenden"

