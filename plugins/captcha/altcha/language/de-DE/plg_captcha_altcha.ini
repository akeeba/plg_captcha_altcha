PLG_CAPTCHA_ALTCHA_FIELD_CUSTOM_CSS_LABEL="Aussehen anpassen"
PLG_CAPTCHA_ALTCHA_FIELD_CUSTOM_CSS_DESC="Wenden Sie <a href=\"https://altcha.org/docs/widget-customization/#appearance\" target=\"_blank\">benutzerdefinierte CSS-Variablen</a> an, um das Aussehen der Oberfläche zu verändern."

PLG_CAPTCHA_ALTCHA_FIELD_BORDER_WIDTH_LABEL="Rahmenbreite"
PLG_CAPTCHA_ALTCHA_FIELD_BORDER_WIDTH_DESC="Die Dicke des Rahmens um das Steuerelement. Geben Sie einen Wert mit Einheit an. Standard: <code>1px</code>"

PLG_CAPTCHA_ALTCHA_FIELD_BORDER_RADIUS_LABEL="Rahmenradius"
PLG_CAPTCHA_ALTCHA_FIELD_BORDER_RADIUS_DESC="Der Radius der abgerundeten Ecken des Rahmens. Geben Sie einen Wert mit Einheit an. Verwenden Sie <code>0</code> für eckige Ecken. Standard: <code>3px</code>"

PLG_CAPTCHA_ALTCHA_FIELD_MAX_WIDTH_LABEL="Maximale Breite"
PLG_CAPTCHA_ALTCHA_FIELD_MAX_WIDTH_DESC="Die maximale Breite des Steuerelements. Geben Sie einen Wert mit Einheit an. Standard: <code>260px</code>"

PLG_CAPTCHA_ALTCHA_FIELD_COLOR_BASE_LABEL="Hintergrundfarbe"
PLG_CAPTCHA_ALTCHA_FIELD_COLOR_BASE_DESC="Die Hintergrundfarbe des Steuerelements."

PLG_CAPTCHA_ALTCHA_FIELD_COLOR_BORDER_LABEL="Rahmenfarbe"
PLG_CAPTCHA_ALTCHA_FIELD_COLOR_BORDER_DESC="Die Farbe des Rahmens um das Steuerelement."

PLG_CAPTCHA_ALTCHA_FIELD_COLOR_TEXT_LABEL="Textfarbe"
PLG_CAPTCHA_ALTCHA_FIELD_COLOR_TEXT_LABEL_DESC="Die Farbe des Textes im Steuerelement."

PLG_CAPTCHA_ALTCHA_FIELD_COLOR_BORDER_FOCUS_LABEL="Fokus-Rahmenfarbe"
PLG_CAPTCHA_ALTCHA_FIELD_COLOR_BORDER_FOCUS_DESC="Die Farbe des Rahmens um das Steuerelement, wenn es fokussiert ist."

PLG_CAPTCHA_ALTCHA_FIELD_COLOR_ERROR_TEXT_LABEL="Fehlertextfarbe"
PLG_CAPTCHA_ALTCHA_FIELD_COLOR_ERROR_TEXT_DESC="Die Farbe des Textes im Steuerelement, der auf einen Fehler hinweist."

PLG_CAPTCHA_ALTCHA_FIELD_COLOR_FOOTER_BG_LABEL="Footer-Hintergrund"
PLG_CAPTCHA_ALTCHA_FIELD_COLOR_FOOTER_BG_DESC="Die Hintergrundfarbe des Footers des Steuerelements, in dem der Text „Geschützt durch“ angezeigt wird."

PLG_CAPTCHA_ALTCHA_FIELD_CUSTOM_CSS_DARK_LABEL="Farben für den Dunkelmodus anpassen"
PLG_CAPTCHA_ALTCHA_FIELD_CUSTOM_CSS_DARK_DESC="Wenden Sie <a href=\"https://altcha.org/docs/widget-customization/#appearance\" target=\"_blank\">benutzerdefinierte CSS-Variablen</a> an, um die Farben der Oberfläche <em>wenn die Seite im <a href=\"https://webkit.org/blog/8840/dark-mode-support-in-webkit/\" target=\"_blank\">Dunkelmodus</a> angezeigt wird</em> zu ändern."

PLG_CAPTCHA_ALTCHA_CUSTOMISE_LANGUAGE_HEAD="🌍 Sprach-Anpassung"
PLG_CAPTCHA_ALTCHA_CUSTOMISE_LANGUAGE_INFO="<p>Sie können die in Ihrem ALTCHA-Steuerelement verwendeten Formulierungen anpassen und/oder übersetzen, indem Sie <a href=\"index.php?option=com_languages&view=overrides\" target=\"_blank\">Sprach-Overrides</a> für die folgenden Sprachstrings erstellen:</p><ul><li><code>PLG_CAPTCHA_ALTCHA_ARIALINKLABEL</code></li><li><code>PLG_CAPTCHA_ALTCHA_ERROR</code></li><li><code>PLG_CAPTCHA_ALTCHA_EXPIRED</code></li><li><code>PLG_CAPTCHA_ALTCHA_FOOTER</code></li><li><code>PLG_CAPTCHA_ALTCHA_LABEL</code></li><li><code>PLG_CAPTCHA_ALTCHA_VERIFIED</code></li><li><code>PLG_CAPTCHA_ALTCHA_VERIFYING</code></li><li><code>PLG_CAPTCHA_ALTCHA_WAITALERT</code></li></ul>"

